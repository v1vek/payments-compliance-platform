name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian_owner
          POSTGRES_PASSWORD: owner_pw
          POSTGRES_DB: meridian
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian_owner" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create app role and test database
        run: PGPASSWORD=owner_pw psql -h localhost -p 5433 -U meridian_owner -d meridian -f docker/initdb/01-roles.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production boot smoke test (migrate + seed + serve on an empty database)
        run: |
          PGPASSWORD=owner_pw psql -h localhost -p 5433 -U meridian_owner -d meridian -c "CREATE DATABASE meridian_boot"
          NODE_ENV=production PORT=4100 DEMO_MODE=true \
            DATABASE_URL=postgres://meridian_app:app_pw@localhost:5433/meridian_boot \
            OWNER_DATABASE_URL=postgres://meridian_owner:owner_pw@localhost:5433/meridian_boot \
            npm start > boot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf localhost:4100/api/health && curl -sf localhost:4100/ | grep -q "<title>Meridian"; then exit 0; fi
            sleep 1
          done
          cat boot.log; exit 1
