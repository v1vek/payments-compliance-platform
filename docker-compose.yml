services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: meridian
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_owner -d meridian"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
